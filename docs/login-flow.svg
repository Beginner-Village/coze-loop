<svg width="920" height="430" viewBox="0 0 920 430" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">简单登录流程图</title>
  <desc id="desc">展示用户从进入登录页、输入账号密码、提交校验，到登录成功进入首页或登录失败返回提示的流程。</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1L9 5L1 9Z" fill="#64748B"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #F8FAFC; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; filter: url(#shadow); }
      .start { fill: #ECFEFF; stroke: #06B6D4; }
      .process { fill: #EFF6FF; stroke: #3B82F6; }
      .decision { fill: #FFF7ED; stroke: #F97316; }
      .success { fill: #ECFDF5; stroke: #10B981; }
      .fail { fill: #FEF2F2; stroke: #EF4444; }
      .title { fill: #0F172A; font: 700 26px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { fill: #0F172A; font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .sub { fill: #475569; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .line { stroke: #64748B; stroke-width: 2.5; marker-end: url(#arrow); }
      .hint { fill: #64748B; font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>

  <rect class="bg" width="920" height="430" rx="24"/>
  <text class="title" x="48" y="54">登录流程</text>
  <text class="sub" x="48" y="79">一个最小可用的用户登录路径，包含成功与失败分支。</text>

  <rect class="card start" x="48" y="145" width="140" height="82" rx="16"/>
  <text class="label" x="118" y="181" text-anchor="middle">进入登录页</text>
  <text class="sub" x="118" y="204" text-anchor="middle">打开应用入口</text>

  <rect class="card process" x="258" y="145" width="150" height="82" rx="16"/>
  <text class="label" x="333" y="181" text-anchor="middle">输入信息</text>
  <text class="sub" x="333" y="204" text-anchor="middle">账号 / 密码</text>

  <rect class="card process" x="478" y="145" width="150" height="82" rx="16"/>
  <text class="label" x="553" y="181" text-anchor="middle">点击登录</text>
  <text class="sub" x="553" y="204" text-anchor="middle">提交表单</text>

  <path class="card decision" d="M735 126L825 186L735 246L645 186Z"/>
  <text class="label" x="735" y="181" text-anchor="middle">校验通过？</text>
  <text class="sub" x="735" y="204" text-anchor="middle">服务端验证</text>

  <rect class="card success" x="632" y="315" width="170" height="82" rx="16"/>
  <text class="label" x="717" y="351" text-anchor="middle">进入首页</text>
  <text class="sub" x="717" y="374" text-anchor="middle">登录成功</text>

  <rect class="card fail" x="270" y="315" width="190" height="82" rx="16"/>
  <text class="label" x="365" y="351" text-anchor="middle">显示错误提示</text>
  <text class="sub" x="365" y="374" text-anchor="middle">重新输入或找回密码</text>

  <path class="line" d="M188 186H248"/>
  <path class="line" d="M408 186H468"/>
  <path class="line" d="M628 186H641"/>
  <path class="line" d="M735 246V305"/>
  <path class="line" d="M645 186H545C506 186 486 212 486 247V356H470"/>
  <path class="line" d="M365 315V269C365 245 346 232 323 232H323C300 232 288 219 288 227"/>

  <text class="hint" x="746" y="287">是</text>
  <text class="hint" x="560" y="174">否</text>
  <text class="hint" x="276" y="260">返回修改</text>
</svg>
